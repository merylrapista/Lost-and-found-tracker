<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Campus Lost & Found | Select Role</title>
<style>
  :root{
    --accent: #1565c0;
    --card-bg: rgba(255,255,255,0.15);
    --card-border: rgba(255,255,255,0.28);
    --muted: #e6eef9;
  }

  *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:
      linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
      url('../uploads/1.jpg') no-repeat center center/cover;
    color:rgb(255,255,255);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    padding:32px;
  }

  header{ text-align:center; margin-bottom:36px; animation:fadeIn .9s ease; }
  header h1{ font-size:3.6rem; letter-spacing:0.6px; color:rgb(119, 111, 145); }
  header p{ color:rgba(230,238,249,0.85); margin-top:6px; }

  .role-container{
    display:flex;
    gap:28px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    width:100%;
    max-width:920px;
  }

  .role-card{
    width:260px;
    height:230px;
    padding:22px;
    border-radius:18px;
    background:var(--card-bg);
    backdrop-filter:blur(12px) saturate(120%);
    border:1px solid var(--card-border);
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:inherit;
    text-align:center;
    transition: transform .32s cubic-bezier(.2,.9,.3,1), box-shadow .32s, background .32s;
    position:relative;
    overflow:hidden;
  }

  .role-card .icon{
    width:74px;
    height:74px;
    border-radius:50%;
    display:inline-grid;
    place-items:center;
    background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06));
    margin-bottom:14px;
    transition: transform .28s ease, box-shadow .28s ease, background .28s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }

  /* SVG styling */
  .icon svg{ width:44px; height:44px; display:block; fill: white; transition: transform .28s, filter .28s; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45)); }
  .role-card h2{ font-size:1.25rem; margin-bottom:6px; color:var(--muted); }
  .role-card p{ color:rgba(230,238,249,0.9); font-size:.95rem; max-width:220px; }

  .role-card:hover{
    transform: translateY(-12px) scale(1.02);
    box-shadow: 0 20px 46px rgba(0,0,0,0.6);
    background: rgba(21,101,192,0.22);
  }

  .role-card:hover .icon{ transform: translateY(-6px) scale(1.03); background: linear-gradient(180deg, rgba(255,255,255,0.26), rgba(255,255,255,0.08)); }
  .role-card:hover .icon svg{ transform: translateY(-2px) scale(1.06); filter: drop-shadow(0 6px 14px rgba(21,101,192,0.35)); }

  /* color accent on hover per card */
  .role-card.user:hover .icon svg{ filter: drop-shadow(0 6px 14px rgba(76,175,80,0.18)); }
  .role-card.admin:hover .icon svg{ filter: drop-shadow(0 6px 14px rgba(255,193,7,0.18)); }

  .role-card:active{ transform: scale(.985); }

  footer{ margin-top:28px; color:rgba(255,255,255,0.7); font-size:.85rem; opacity:.95; }

  @keyframes fadeIn{ from{opacity:0; transform:translateY(-14px);} to{opacity:1; transform:translateY(0);} }

  @media(max-width:720px){
    .role-card{ width:88%; max-width:420px; height:180px; flex-direction:row; gap:18px; padding:18px; align-items:center; }
    .icon{ width:64px; height:64px; margin-bottom:0; margin-right:8px; }
    .role-card h2{ font-size:1.05rem; }
    .role-card p{ font-size:.9rem; text-align:left; }
    header h1{ font-size:1.6rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Campus Lost & Found Tracker</h1>
  <!-- <p>Select your role to continue</p> -->
</header>

<div class="role-container">

  <!-- USER CARD -->
  <a href="../php/login.php" class="role-card user" aria-label="User login">
    <div class="icon" aria-hidden="true">
      <!-- User SVG: simple rounded avatar -->
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="userTitle">
        <title id="userTitle">User</title>
        <g fill="none" fill-rule="evenodd">
          <circle cx="32" cy="24" r="12" fill="currentColor" opacity="0.98"/>
          <path d="M10 52c0-8.84 7.16-16 16-16h12c8.84 0 16 7.16 16 16v2H10v-2z" fill="currentColor" opacity="0.95"/>
        </g>
      </svg>
    </div>
    <div>
      <h2> User</h2>
      <!-- <p>Report missing items, browse found listings, and claim belongings.</p> -->
    </div>
  </a>

  <!-- ADMIN CARD -->
  <a href="../php/admin_login.php" class="role-card admin" aria-label="Administrator login">
    <div class="icon" aria-hidden="true">
      <!-- Admin SVG: gear -->
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adminTitle">
        <title id="adminTitle">Administrator</title>
        <g fill="none" fill-rule="evenodd">
          <path d="M32 22a10 10 0 100 20 10 10 0 000-20z" fill="currentColor" opacity="0.98"/>
          <path d="M58 36v-8l-5.2-1.7a20 20 0 00-1.9-4.6L53 14l-6-3.4-3.3 4.3a19.9 19.9 0 00-5.1-1.1L32 8h-8l-2.6 6.9a19.9 19.9 0 00-5.1 1.1L13 10 7 13.4l2.1 7.1a20 20 0 00-1.9 4.6L2 28v8l5.2 1.7c.4 1.6 1 3.1 1.9 4.6L11 50l6 3.4 3.3-4.3c1.6.6 3.3 1 5.1 1.1L24 56h8l2.6-6.9c1.8-.1 3.5-.5 5.1-1.1l3.3 4.3 6-3.4-2.1-7.1c.9-1.5 1.5-3 1.9-4.6L58 36z" fill="currentColor" opacity="0.85"/>
        </g>
      </svg>
    </div>
    <div>
      <h2>Administrator</h2>
      <!-- <p>Manage reports, verify claims, and oversee lost & found operations.</p> -->
    </div>
  </a>

</div>

</body>
</html>
